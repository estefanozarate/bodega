.lv h1{font-size:40px;line-height:1.1;max-width:13ch}.lv p{font-weight:600;max-width:30ch;opacity:.92}
.lf{display:flex;align-items:center;justify-content:center;padding:28px}.lf form{width:100%;max-width:380px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:800}
input,select{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;width:100%;min-height:54px}
.btn{background:var(--g);color:#fff;border:0;border-radius:16px;min-height:58px;padding:12px 22px;font-weight:900;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 var(--gd)}
.btn:active{transform:translateY(2px);box-shadow:none}.btn.o{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.r{background:#fff;color:var(--red);border:2px solid #efc3be;box-shadow:none}.btn.sm{min-height:48px;padding:8px 16px;font-size:17px}
.logo{display:flex;gap:10px;align-items:center;font-weight:900;font-size:22px}.logo i{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-style:normal}
header{background:#fff;border-bottom:2px solid var(--line);padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
.out{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:20px 16px 190px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;border:0;background:none;border-radius:16px;padding:8px 2px;font-weight:900;font-size:15px;color:var(--mut);display:grid;gap:2px;justify-items:center}
nav button b{font-size:28px;line-height:1}nav button.on{background:#d9f2e4;color:var(--gd)}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px}
.hero{background:linear-gradient(135deg,#0a7a4c,#054630);color:#fff;border:0;margin-bottom:14px}
.hero .big{font-size:50px;font-weight:900;line-height:1.1;margin:6px 0}.hero .mut{color:#c4e8d6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.num{font-size:30px;font-weight:900;margin-top:4px}.pos{color:var(--g)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.warnbox{background:var(--warn);border:2px solid #efd271;border-radius:20px;padding:16px;margin:14px 0;color:#5a3d00}
.warnbox .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chips button{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:10px 18px;font-weight:800}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center;display:grid;gap:2px;justify-items:center;min-height:170px}
.tile:active{transform:scale(.97)}.tile .e{font-size:54px;line-height:1.1}.tile b{font-size:17px;line-height:1.15}.tile .p{font-size:22px;font-weight:900;color:var(--gd)}
.tile.no{opacity:.45}.badge{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;border-radius:99px;min-width:32px;height:32px;display:grid;place-items:center;font-weight:900;padding:0 8px}
.pill{font-size:14px;font-weight:800;border-radius:99px;padding:3px 10px;background:#d9f2e4;color:#0b6e45;white-space:nowrap}
.pill.lo{background:var(--warn);color:#7a5200}.pill.z{background:#fbdad6;color:#a3281f}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9;max-width:836px;margin:0 auto;background:var(--gd);color:#fff;border-radius:20px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.cartbar .btn{background:#fff;color:var(--gd);box-shadow:none}
.row{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.row .e{font-size:42px}.row .t{flex:1;min-width:140px}.row .t b{display:block;font-size:19px}.row .bt{display:flex;gap:8px}
.step{display:flex;align-items:center;gap:8px}.step button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;font-weight:900}.step span{min-width:28px;text-align:center;font-size:22px;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tabs button{border:2px solid var(--line);background:#fff;border-radius:16px;min-height:54px;font-weight:900}
.tabs button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;font-weight:800;color:var(--mut)}

  (S.sales.length?'<button class="btn r" style="width:100%;margin-top:22px" data-a="reset">Borrar todas las ventas y empezar de cero</button>':'')}

function ganDetail(l){var h="";
 if(!l.length)return '<div class="card empty">Todavía no hay ventas en este periodo.</div>';
 if(per!="hoy"){var by={},ks=[];l.slice().reverse().forEach(function(s){var k=new Date(s.t).toDateString();if(!by[k]){by[k]=[];ks.push(k)}by[k].push(s)});
  var mx=Math.max.apply(0,ks.map(function(k){return agg(by[k]).v}));
  h+='<div class="card" style="margin-bottom:14px"><h2>Ventas por día</h2><div class="bars">'+ks.map(function(k){var a=agg(by[k]);return '<div><span>'+(ks.length<=8?Math.round(a.v):'')+'</span><i style="height:'+Math.max(3,a.v/mx*110)+'px"></i><span>'+new Date(k).getDate()+'</span></div>'}).join("")+'</div></div>'+
  '<div class="card" style="margin-bottom:14px"><h2>Día por día</h2>'+ks.slice().reverse().map(function(k){var a=agg(by[k]);return '<div class="dr"><div><b>'+dl(new Date(k))+'</b><div class="mut">'+a.u+' productos · '+a.n+' ventas</div></div><div class="r"><b>'+m(a.v)+'</b><div class="pos">gané '+m(a.g)+'</div></div></div>'}).join("")+'</div><div class="card" style="margin-bottom:14px"><h2>Cada venta (fecha y hora)</h2>'+l.slice(0,30).map(sline).join("")+'</div>'}
 else h+='<div class="card" style="margin-bottom:14px"><h2>Ventas de hoy</h2>'+l.map(function(s){var t=stot(s);return '<div class="dr"><div><b>'+hm(s.t)+(s.n?' · Venta N° '+("000"+s.n).slice(-4):'')+'</b><div class="mut">'+s.items.map(function(i){return i.qty+' × '+esc(i.name)}).join(", ")+'</div></div><div class="r"><b>'+m(t.v)+'</b><div class="pos">+'+m(t.g)+'</div></div></div>'}).join("")+'</div>';
 var tp={};l.forEach(function(s){s.items.forEach(function(i){tp[i.name]=(tp[i.name]||0)+i.qty})});
 var top=Object.keys(tp).sort(function(a,b){return tp[b]-tp[a]}).slice(0,5);
 return h+'<div class="card"><h2>Lo que más se vende</h2>'+top.map(function(n,i){return '<div class="dr"><span>'+(i+1)+'. '+esc(n)+'</span><b>'+tp[n]+' und.</b></div>'}).join("")+'</div>'}
function modal(h){var d=document.createElement("div");d.className="modal";d.innerHTML="<div>"+h+"</div>";document.body.appendChild(d);d.onclick=function(e){if(e.target==d)d.remove()};d.close=function(){d.remove()};return d}

 function paint(){var c=cartInfo();if(!c.n){d.close();render();return}
 d.firstChild.innerHTML='<h2>Cuenta del cliente</h2><div class="mut">🗓 <span class="cd"></span> · 🕒 <b class="ck"></b></div>'+ids.filter(function(i){return cart[i]}).map(function(i){var p=prod(i);return '<div class="row" style="margin:0"><span class="e">'+p.emoji+'</span><div class="t"><b>'+esc(p.name)+'</b>'+m(p.price*cart[i])+'</div><div class="step"><button data-q="-1" data-i="'+i+'" aria-label="Quitar uno">−</button><span>'+cart[i]+'</span><button data-q="1" data-i="'+i+'" aria-label="Agregar uno">+</button></div></div>'}).join("")+
 '<div style="display:flex;justify-content:space-between;font-size:30px;font-weight:900;padding:6px 2px"><span>Total</span><span>'+m(c.v)+'</span></div><label>¿Con cuánto paga el cliente? (para el vuelto)<input id="pg" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Ej: 20"></label><div id="vu" class="mut" style="font-size:22px;font-weight:900"></div><button class="btn" id="ok">✅ Cobrar '+m(c.v)+'</button><button class="btn o" id="cl">Seguir vendiendo</button>';
 $("#cl").onclick=function(){d.close();render()};$("#ok").onclick=cobrar;
 $("#pg").oninput=function(){var v=+this.value,t=cartInfo().v;$("#vu").textContent=v?(v>=t?"Vuelto: "+m(v-t):"Falta "+m(t-v)):""};tick()}
 function cobrar(){var items=[],c=cartInfo();ids.forEach(function(i){if(cart[i]){var p=prod(i);p.stock-=cart[i];items.push({id:p.id,name:p.name,qty:cart[i],price:p.price,cost:p.cost})}});
  var pg=parseFloat($("#pg").value)||0,s={n:(S.seq=(S.seq||0)+1),t:Date.now(),items:items,paid:pg};S.sales.unshift(s);save();cart={};d.close();render();receipt(s)}
 d.addEventListener("click",function(e){var b=e.target.closest("[data-q]");if(!b)return;var i=b.dataset.i,p=prod(i),n=cart[i]+ +b.dataset.q;
  if(n>p.stock){toast("Solo tienes "+p.stock+" en stock");return}cart[i]=Math.max(0,n);if(!cart[i])delete cart[i];paint()});paint()}

 $("#rq").focus();$("#rc").onclick=d.close;$("#rk").onclick=function(){var n=Math.floor(+$("#rq").value);if(!(n>0)){toast("Escribe cuántas llegaron");return}p.stock+=n;p.max=Math.max(p.max||0,p.stock);save();d.close();render();toast("Stock actualizado: "+p.stock)}}

 $("#eg").onclick=function(e){var b=e.target.closest("[data-e]");if(!b)return;em=b.dataset.e;this.querySelectorAll("button").forEach(function(x){x.className=x==b?"on":""})};
 $("#cn").onclick=d.close;

function hash(p,salt){var s=salt+":"+p;
 if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")});
 var h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return Promise.resolve("f"+h.toString(16))}
function err(x){var e=$("#er");e.textContent=x;e.classList.remove("hide")}

 $("#bn").required=$("#pw2").required=k=="up";$("#go").textContent=k=="in"?"Ingresar":"Crear mi cuenta";$("#lt").textContent=k=="in"?"¡Bienvenido de vuelta!":"Crea tu cuenta gratis";
 $("#pw").autocomplete=k=="in"?"current-password":"new-password";$("#er").classList.add("hide");
 $("#hp").textContent=k=="in"?"¿Primera vez? Toca “Crear cuenta”. Cada bodega tiene su propio usuario y sus propios datos.":"Tus datos se guardan en este equipo. Si olvidas tu contraseña no se puede recuperar en esta versión de prueba."}

$("#lf").onsubmit=function(e){e.preventDefault();var u=$("#un").value.trim().toLowerCase().replace(/\s+/g,""),p=$("#pw").value;
 if(!/^[a-z0-9._-]{3,20}$/.test(u))return err("El usuario debe tener de 3 a 20 letras o números, sin espacios.");
 if(p.length<4)return err("La contraseña debe tener al menos 4 caracteres.");
 if(mode=="in"){var r=U[u];if(!r)return err("No encontramos ese usuario. ¿Quieres crear tu cuenta?");
  hash(p,r.salt).then(function(h){if(h!=r.hash)return err("La contraseña no es correcta. Inténtalo otra vez.");enter(u)});return}
 var b=$("#bn").value.trim();if(!b)return err("Escribe el nombre de tu bodega.");if(p!=$("#pw2").value)return err("Las contraseñas no coinciden.");if(U[u])return err("Ese usuario ya existe. Elige otro o ingresa.");
 var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
 hash(p,salt).then(function(h){var primero=!Object.keys(U).length,old=lsGet("mibodega_v4");U[u]={salt:salt,hash:h,bodega:b,creada:Date.now()};lsSet(UK,U);
